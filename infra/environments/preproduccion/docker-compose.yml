version: '3.8'
volumes:
  jornadas-storage:
    driver: local

networks:
  cae-services:
    external: true

secrets:
  key_2025:
    external: true
  crt_2025:
    external: true


services:
  front:
    image: registrygitlab.ssaver.gob.mx/jornadas-medicas/jornadas_front/app:latest-test
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - target: 443
        published: 443
      - target: 80
        published: 80
    networks:
      - cae-services
    secrets:
      - source: crt_2025
        target: /cert/server.crt
      - source: key_2025
        target: /cert/server.key
    deploy:
      replicas: 1