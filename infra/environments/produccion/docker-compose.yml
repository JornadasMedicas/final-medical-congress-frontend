version: '3.8'
volumes:
  jornadas-storage:
    driver: local

networks:
  jornadas_network:
    external: true

secrets:
  key_2025:
    external: true
  crt_2025:
    external: true


services:
  front:
    image: reddebjsh/jornadas2025:front-1.0.0
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - target: 443
        published: 443
      - target: 80
        published: 80
    networks:
      - jornadas_network
    secrets:
      - source: crt_2025
        target: /cert/server.crt
      - source: key_2025
        target: /cert/server.key
    deploy:
      replicas: 1