server {

        listen 80 default_server;
        listen [::]:80 default_server;
        server_name jornadasmedicascaepre.ssaver.gob.mx;
        client_max_body_size 100M;

        location / {
            root   /var/www/html/jornadas;
            index  index.html index.htm;
            try_files $uri /index.html;
        }

        location /assets/ {
            alias /var/www/html/jornadas/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";   
        }

        location /carousel/ {
            alias /var/www/html/jornadas/carousel/;
            expires 1y;
            add_header Cache-Control "public, immutable";  
        }

        location ~* \.(webp|ico|svg)$ {
            root /var/www/html/jornadas;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }


        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /var/www/html/jornadas;
        }
}   